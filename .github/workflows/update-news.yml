name: Update news data

on:
  schedule:
    # 每 30 分鐘抓一次（UTC）。GitHub 免費公開 repo 的 cron 是 best-effort，
    # 負載高時會直接「跳過」整次排程（實測曾連續漏掉 5 次、資料停在 11 小時前），
    # 所以刻意排密一點：就算被丟掉一半，實際更新間隔仍在 1 小時上下。
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and classify news
        run: node scripts/fetch-news.mjs

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No change in news data."
          else
            git commit -m "chore: refresh news data [skip ci]"
            git push
          fi
